{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}
Job Application Edit
{% endblock title %}

{% block content %}
  <!-- **********************************
    Content body start
*********************************** -->
  <div class="content-body">
    <!-- row -->
    <!-- row -->
    <div class="container-fluid">
      <div class="form-head page-titles d-flex align-items-center">
        <div class="mr-auto d-lg-block">
          <h2 class="text-black font-w600">Job Application</h2>
        </div>
        <a href="{% url 'job_application_view' %}" class="btn btn-primary rounded light mr-3">View</a>
      </div>
      <div class="row">
        {% load crispy_forms_tags %}
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary d-none" id="mark">Submit</button>
          {% if query.status == 'pending' %}
            <input type="hidden" name="status" value="read" />
            <script>
              window.onload = function () {
                document.getElementById('mark').click()
              }
            </script>
          {% endif %}
        </form>
      </div>
    </div>
  </div>
  <!-- **********************************
            Content body end
        *********************************** -->
{% endblock %}
