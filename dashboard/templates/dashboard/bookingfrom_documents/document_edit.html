{% extends 'dashboard/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}
Edit Document
{% endblock title %}

{% block content %}
<!-- **********************************
    Content body start
*********************************** -->
<div class="content-body">
  <div class="container-fluid">
    <div class="form-head page-titles d-flex align-items-center">
      <div class="mr-auto d-lg-block">
        <h2 class="text-black font-w600">Edit Document</h2>
      </div>
      <a href="{% url 'document_view' %}" class="btn btn-primary rounded light mr-3">Back to List</a>
    </div>

    <div class="row">
      <div class="col-xl-6">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.media }}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary">Update</button>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- **********************************
    Content body end
*********************************** -->
{% endblock %}
