{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}
Album View
{% endblock title %}

{% block content %}
  <!-- **********************************
    Content body start
*********************************** -->
  <div class="content-body">
    <!-- row -->
    <!-- row -->
    <div class="container-fluid">
      <div class="form-head page-titles d-flex align-items-center">
        <div class="mr-auto d-lg-block">
          <h2 class="text-black font-w600">Album</h2>
        </div>
        <a href="{% url 'album_add' %}" class="btn btn-primary rounded light mr-3">Add Album</a>
      </div>
      <div class="row">
        <div class="col-xl-12">
          <div class="table-responsive table-hover fs-14">
            <table class="table table-hover display mb-4 dataTablesCard card-table" id="example-5">
              <thead>
                <tr>
                  <th>Pro. ID</th>
                  <th>Cover image</th>
                  <th>Tilte</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                {% for i in query %}
                  <tr>
                    <td>{{ i.id }}</td>
                    <td>
                      {% if i.image %}
                        <img src="{{ i.image.url }}" class="dynamic-img" style="--aspect: 3 / 2;" />
                      {% endif %}
                    </td>
                    <td>{{ i.title }}</td>
                    <td>
                      <a href="{% url 'album_edit' i.id %}" class="text-info h4 mr-1" data-bs-toggle="tooltip" data-bs-original-title="Edit"><i class="ti-marker-alt"></i></a>
                      <a href="javascript:void(0)" class="text-danger delete-link h4" data-url="{% url 'album_delete' i.id %}" data-bs-original-title="Delete" data-bs-toggle="tooltip"><i class="ti-trash"></i></a>
                    </td>
                  </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- **********************************
            Content body end
        *********************************** -->
{% endblock %}
