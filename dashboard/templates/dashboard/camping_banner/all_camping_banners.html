{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}
Camping Banner
{% endblock title %}

{% block content %}
<div class="content-body">
  <div class="container-fluid">
    <div class="form-head page-titles d-flex align-items-center">
      <div class="mr-auto d-lg-block">
        <h2 class="text-black font-w600">Camping Banner</h2>
      </div>
      <a href="{% url 'add_camping_banners' %}" class="btn btn-primary rounded light mr-3">Add New</a>
    </div>
    <div class="row">
      {% if all_camping_banner %}
        <img src="{{ camping_banner.camping_banner.url }}" alt="Camping Banner" class="img-fluid rounded shadow">
      {% else %}
        <p>No banner added yet.</p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
