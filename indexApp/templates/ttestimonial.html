{% extends 'tbase.html' %}
{% load static %}

{% block title %}
  Testimonial
{% endblock %}

{% block content %}
  <!-- Margin top -->
  <div class="text-white pt-40" style="background-image: url('{% static 'indexApp/images/company-profile.jpg' %}');">
    <div class="container mx-auto py-6 px-4">
      <p class="text-4xl">Testimonial</p>

      <p class="pt-5 text-lg">
        <a href="/">Home</a> > Testimonial
      </p>
    </div>
  </div>

  <div class="container mx-auto">
    <p class="text-4xl pt-10">Land Owner Reviews</p>
    <div class="grid grid-cols-2 lg:grid-cols-3 gap-10 py-5">
      {% for q in query %}
        <div class="border shadow-xl">
          <a href="{% url 'awards_details' q.pk %}">
            <div class="w-full">
              <img src="{{ q.image.url }}" alt="" class="h-96 w-auto rounded-lg object-contain  shadow-xl" />
            </div>
          </a>
          <div class="px-4 py-2">
            <p class="text-xl font-bold">{{ q.title }}</p>
          </div>
          <div class="h-80 overflow-x-auto p-4">
            <div class="pt-5">
              <p>{{ q.details|safe }}</p>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
{% endblock %}
