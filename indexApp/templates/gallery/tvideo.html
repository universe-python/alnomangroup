{% extends 'tbase.html' %}

{% load static %}
{% load forloop_counter %}

{% block title %}
  Video Gallery
{% endblock %}

{% block content %}
  <!-- Margin top -->
  <div class="text-white pt-40" style="background-image: url('https://www.assuregroupbd.com/images/banners/company-profile.jpg');">
    <div class="container mx-auto py-6 px-4">
      <p class="text-4xl">Video Gallery</p>

      <p class="pt-5 text-lg">
        <a href="/">Home</a> > Video Gallery
      </p>
    </div>
  </div>

  <div class="container mx-auto pb-10 px-2">
    <div class="grid md:grid-cols-2 gid-cols-1 gap-5 pt-10">
        {% for video in query %}
            <div class="">
              <iframe class="w-full" height="315" src="{{video.video_url}}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
              <div class="bg-[#687484] text-white">
                <div class="text-center py-2">
                  <p>{{video.title}}</p>
                  <p>{{video.published_by}}</p>
                </div>
              </div>
            </div>
        {% endfor %}
